<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Shuffle</title>
    <link rel="stylesheet" href="/stylesheet/style.css">
    <script src="/js/script.js" defer></script>
</head>
<body>
    <header class="nav-bar">
        <nav>
            <span class="titulo">Steam Shuffle</span>
        </nav>
    </header>

    <main>
        <div class="info-box">
            <h2>Qual será o jogo de hoje?</h2>

            <div id="resultado" class="resultado" hidden>
                <img id="capa-jogo" alt="Capa do jogo sorteado">
                <h3 id="nome-jogo"></h3>
                <a id="link-jogo" target="_blank" rel="noopener noreferrer">
                    Ver na Steam
                </a>
            </div>

            <p id="mensagem"></p>
            <label for="steamId">Link do perfil ou Steam ID64</label>
            <input
                id="steamId"
                type="text"
                placeholder="Link do perfil steam"
                inputmode="url"
            />

            <button class="botao" id="botao-sortear">
                Sortear
            </button>
        </div>
    </main>
    
</body>
</html>
